<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Wisata</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <style>
    :root {
      --primary: #2563eb;
      --secondary: #9333ea;
      --accent: #22c55e;

      --text: #0f172a;
      --muted: #64748b;

      --bg: #f1f5f9;
      --card: rgba(255, 255, 255, 0.92);
      --border: rgba(0,0,0,0.06);

      --shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      --radius: 22px;
    }

    body.dark {
      --text: #f8fafc;
      --muted: #94a3b8;

      --bg: #0b1220;
      --card: rgba(20, 27, 45, 0.92);
      --border: rgba(255,255,255,0.08);

      --shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      transition: 0.25s;
    }

    /* SPLASH */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      flex-direction: column;
      text-align: center;
      transition: opacity 0.5s ease;
    }

    .splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,255,255,0.35);
      border-top: 4px solid white;
      border-radius: 50%;
      margin-top: 18px;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* PAGE ANIMATION */
    .page {
      opacity: 0;
      transform: translateY(14px);
      animation: pageIn 0.45s ease forwards;
    }

    @keyframes pageIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 99;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      text-align: center;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.14);
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
    }

    .top-actions {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.22);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
      user-select: none;
      color: white;
      text-decoration: none;
    }

    .chip:hover {
      background: rgba(255,255,255,0.26);
    }

    /* CONTAINER */
    .container {
      max-width: 900px;
      margin: auto;
      padding: 18px;
      padding-bottom: 80px;
    }

    /* CARD */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      animation: fadeUp 0.35s ease;
    }

    .hero {
      position: relative;
      height: 340px;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.05);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.78), transparent 60%);
    }

    .hero-title {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      color: white;
    }

    .hero-title h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.2;
    }

    .hero-title span {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 14px;
      background: rgba(34, 197, 94, 0.95);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .content {
      padding: 18px;
    }

    .desc {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
    }

    /* INFO GRID */
    .info-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .info {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.95);
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
      font-size: 13px;
      line-height: 1.5;
    }

    body.dark .info {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .info b {
      display: block;
      margin-bottom: 5px;
      color: var(--primary);
      font-weight: 900;
    }

    .info a {
      color: var(--secondary);
      font-weight: 800;
      word-break: break-all;
      text-decoration: none;
    }

    /* BUTTONS */
    .btn-row {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      text-align: center;
      padding: 13px 14px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 900;
      font-size: 14px;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.28);
      transition: 0.2s;
      cursor: pointer;
      border: none;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(100, 116, 139, 0.16);
      color: var(--text);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: none;
    }

    /* QR */
    .qr-box {
      margin-top: 22px;
      padding: 18px;
      background: linear-gradient(135deg, rgba(37,99,235,0.12), rgba(147,51,234,0.12));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }

    .qr-box h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
    }

    .qr-box p {
      margin: 8px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }

    #qrcode {
      width: 220px;
      height: 220px;
      margin: 16px auto 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 12px 25px rgba(15, 23, 42, 0.08);
    }

    body.dark #qrcode {
      background: rgba(15, 23, 42, 0.8);
    }

    #qrcode img,
    #qrcode canvas {
      width: 200px !important;
      height: 200px !important;
      display: block;
    }

    .qr-link {
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: 0.35s;
      z-index: 9999;
      max-width: 85%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    .loading {
      padding: 20px;
      text-align: center;
      font-weight: 900;
      color: var(--muted);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media(min-width: 720px) {
      .info-grid { grid-template-columns: 1fr 1fr; }
      .btn-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

<body>

<!-- Splash -->
<div class="splash" id="splash">
  <h1>📍 Detail Destinasi</h1>
  <p>Memuat informasi wisata...</p>
  <div class="loader"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<div class="page">

  <header>
    <h1>📍 Detail Objek Wisata</h1>

    <div class="top-actions">
      <a class="chip" href="index.html">🏠 Home</a>
      <a class="chip" href="favorites.html">⭐ Favorit</a>
      <div class="chip" onclick="toggleDarkMode()">🌙 Dark Mode</div>
    </div>
  </header>

  <div class="container">

    <div class="card" id="detailCard">
      <div class="loading">⏳ Memuat data wisata...</div>
    </div>

    <div class="btn-row">
      <a class="btn btn-secondary" href="index.html">⬅ Kembali</a>
      <a class="btn" href="favorites.html">⭐ Lihat Favorit</a>
    </div>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  const apiURL = "https://script.google.com/macros/s/AKfycby49SpyBrJYMG5yMdFZHkHUPraZb52kXiclR1DFvwsEleFAkXseRsFwabrZJuE8s0w/exec";
  let currentId = null;

  // ========= TOAST =========
  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");

    setTimeout(() => {
      toast.classList.remove("show");
    }, 2200);
  }

  // ========= FAVORITES =========
  function getFavorites() {
    return JSON.parse(localStorage.getItem("favorites")) || [];
  }

  function saveFavorites(favs) {
    localStorage.setItem("favorites", JSON.stringify(favs));
  }

  function isFavorite(id) {
    return getFavorites().includes(String(id));
  }

  function toggleFavorite(id) {
    let favs = getFavorites();
    id = String(id);

    if (favs.includes(id)) {
      favs = favs.filter(x => x !== id);
      showToast("❌ Dihapus dari Favorit");
    } else {
      favs.push(id);
      showToast("✅ Ditambahkan ke Favorit");
    }

    saveFavorites(favs);
    loadDetail(true);
  }

  // ========= DARK MODE =========
  function loadDarkMode() {
    const mode = localStorage.getItem("darkMode");
    if (mode === "on") document.body.classList.add("dark");
  }

  function toggleDarkMode() {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
      localStorage.setItem("darkMode", "on");
      showToast("🌙 Dark Mode Aktif");
    } else {
      localStorage.setItem("darkMode", "off");
      showToast("☀ Light Mode Aktif");
    }
  }

  // ========= SPLASH =========
  function hideSplash() {
    const splash = document.getElementById("splash");
    splash.classList.add("hide");
    setTimeout(() => splash.style.display = "none", 550);
  }

  // ========= OFFLINE BACKUP =========
  function saveOfflineData(data) {
    localStorage.setItem("cachedWisataData", JSON.stringify(data));
    localStorage.setItem("cachedWisataTime", new Date().toISOString());
  }

  function loadOfflineData() {
    return JSON.parse(localStorage.getItem("cachedWisataData")) || null;
  }

  // ========= QUERY PARAM =========
  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  // ========= LOAD DETAIL =========
  async function loadDetail(noSplash = false) {
    const id = getQueryParam("id");
    currentId = id;

    if (!id) {
      document.getElementById("detailCard").innerHTML =
        "<div class='loading'>❌ ID wisata tidak ditemukan.</div>";
      hideSplash();
      return;
    }

    try {
      const res = await fetch(apiURL);
      const data = await res.json();
      saveOfflineData(data);

      renderDetail(data, id);
      if (!noSplash) hideSplash();

    } catch (err) {
      console.error(err);

      const offline = loadOfflineData();

      if (offline) {
        renderDetail(offline, id);
        showToast("📡 Offline Mode: Data terakhir digunakan");
      } else {
        document.getElementById("detailCard").innerHTML =
          "<div class='loading'>❌ Tidak ada data offline tersedia.</div>";
      }

      if (!noSplash) hideSplash();
    }
  }

  function renderDetail(data, id) {
    const wisata = data.find(item => item.id == id);

    if (!wisata) {
      document.getElementById("detailCard").innerHTML =
        "<div class='loading'>❌ Data wisata tidak ditemukan.</div>";
      return;
    }

    const detailLink = window.location.origin +
      window.location.pathname.replace("detail.html", "") +
      `detail.html?id=${wisata.id}`;

    const favBtnText = isFavorite(id) ? "❤️ Hapus Favorit" : "🤍 Tambah Favorit";

    document.getElementById("detailCard").innerHTML = `
      <div class="hero">
        <img src="${wisata.foto}" alt="${wisata.nama}">
        <div class="hero-overlay"></div>
        <div class="hero-title">
          <h2>${wisata.nama}</h2>
          <span>${wisata.kategori || "Umum"}</span>
        </div>
      </div>

      <div class="content">
        <p class="desc">${wisata.deskripsi || ""}</p>

        <div class="info-grid">
          <div class="info">
            <b>📌 Lokasi (Google Maps)</b>
            <a href="${wisata.lokasi}" target="_blank">${wisata.lokasi}</a>
          </div>

          ${wisata.jam_buka ? `
            <div class="info">
              <b>🕒 Jam Buka</b>
              ${wisata.jam_buka}
            </div>
          ` : ""}

          ${wisata.tiket ? `
            <div class="info">
              <b>🎟 Harga Tiket</b>
              ${wisata.tiket}
            </div>
          ` : ""}

          ${wisata.kontak ? `
            <div class="info">
              <b>📞 Kontak</b>
              ${wisata.kontak}
            </div>
          ` : ""}
        </div>

        <div class="btn-row">
          <a class="btn" href="${wisata.lokasi}" target="_blank">📍 Buka di Google Maps</a>
          <button class="btn btn-secondary" onclick="toggleFavorite(${wisata.id})">${favBtnText}</button>
        </div>

        <div class="qr-box">
          <h3>📱 QR Code Destinasi</h3>
          <p>Scan QR untuk membuka halaman destinasi ini di smartphone.</p>
          <div id="qrcode"></div>
          <div class="qr-link">${detailLink}</div>
        </div>
      </div>
    `;

    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {
      text: detailLink,
      width: 200,
      height: 200,
      correctLevel: QRCode.CorrectLevel.H
    });
  }

  // INIT
  loadDarkMode();
  loadDetail();
</script>

<script>
  // Smooth transition when leaving page
  document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", function(e) {
      const href = this.getAttribute("href");
      if (!href || href.startsWith("#") || href.startsWith("http")) return;

      e.preventDefault();
      document.body.style.opacity = "0";
      setTimeout(() => {
        window.location.href = href;
      }, 200);
    });
  });
</script>

<script>
  // Service Worker register
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
      .then(() => console.log("Service Worker Registered"))
      .catch(err => console.log("SW Failed", err));
  }
</script>

</body>
</html>
