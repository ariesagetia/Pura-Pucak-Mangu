<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favorit Saya</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <style>
    :root {
      --primary: #2563eb;
      --secondary: #9333ea;
      --accent: #22c55e;

      --text: #0f172a;
      --muted: #64748b;

      --bg: #f1f5f9;
      --card: rgba(255, 255, 255, 0.92);
      --border: rgba(0,0,0,0.06);

      --shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      --radius: 22px;
    }

    body.dark {
      --text: #f8fafc;
      --muted: #94a3b8;

      --bg: #0b1220;
      --card: rgba(20, 27, 45, 0.92);
      --border: rgba(255,255,255,0.08);

      --shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      transition: 0.25s;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 18px 18px 22px;
      color: white;
      text-align: left;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 900;
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: 0.95;
    }

    .top-actions {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.22);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
      user-select: none;
      text-decoration: none;
      color: white;
    }

    .chip:hover {
      background: rgba(255,255,255,0.26);
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 18px;
      padding-bottom: 90px;
    }

    .grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      border: 1px solid var(--border);
      transition: 0.2s;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .img-wrap {
      position: relative;
      height: 190px;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      transform: scale(1.05);
      transition: 0.4s;
    }

    .card:hover img {
      transform: scale(1.15);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
    }

    .badge {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(34, 197, 94, 0.95);
      color: white;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .fav-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: 0.2s;
      z-index: 10;
    }

    body.dark .fav-btn {
      background: rgba(15, 23, 42, 0.75);
      color: white;
    }

    .card-content {
      padding: 14px 15px 18px;
    }

    .card-content h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
    }

    .card-content p {
      margin: 8px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      font-weight: 800;
      margin-top: 20px;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: 0.35s;
      z-index: 9999;
      max-width: 85%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }
  </style>
</head>

<body>

<div class="toast" id="toast"></div>

<header>
  <h1>⭐ Favorit Saya</h1>
  <p>Destinasi wisata yang sudah Anda simpan</p>

  <div class="top-actions">
    <a class="chip" href="index.html">⬅ Home</a>
    <div class="chip" onclick="toggleDarkMode()">🌙 Dark Mode</div>
    <div class="chip" onclick="clearFavorites()">🗑 Hapus Semua</div>
  </div>
</header>

<div class="container">
  <div class="grid" id="favList">
    <p class="loading">⏳ Memuat favorit...</p>
  </div>
</div>

<script>
  const apiURL = "https://script.google.com/macros/s/AKfycby49SpyBrJYMG5yMdFZHkHUPraZb52kXiclR1DFvwsEleFAkXseRsFwabrZJuE8s0w/exec";
  let wisataData = [];

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");

    setTimeout(() => toast.classList.remove("show"), 2200);
  }

  function getFavorites() {
    return JSON.parse(localStorage.getItem("favorites")) || [];
  }

  function saveFavorites(favs) {
    localStorage.setItem("favorites", JSON.stringify(favs));
  }

  function loadDarkMode() {
    const mode = localStorage.getItem("darkMode");
    if (mode === "on") document.body.classList.add("dark");
  }

  function toggleDarkMode() {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
      localStorage.setItem("darkMode", "on");
      showToast("🌙 Dark Mode Aktif");
    } else {
      localStorage.setItem("darkMode", "off");
      showToast("☀ Light Mode Aktif");
    }
  }

  function clearFavorites() {
    if (!confirm("Hapus semua favorit?")) return;
    localStorage.removeItem("favorites");
    showToast("🗑 Favorit berhasil dihapus");
    renderFavorites([]);
  }

  function saveOfflineData(data) {
    localStorage.setItem("cachedWisataData", JSON.stringify(data));
  }

  function loadOfflineData() {
    return JSON.parse(localStorage.getItem("cachedWisataData")) || null;
  }

  async function loadWisata() {
    try {
      const res = await fetch(apiURL);
      wisataData = await res.json();
      saveOfflineData(wisataData);
      renderFavorites(wisataData);
    } catch (err) {
      console.error(err);
      const offline = loadOfflineData();

      if (offline) {
        wisataData = offline;
        renderFavorites(wisataData);
        showToast("📡 Offline Mode: Data terakhir digunakan");
      } else {
        document.getElementById("favList").innerHTML =
          "<p class='loading'>❌ Tidak ada data offline.</p>";
      }
    }
  }

  function toggleFavorite(id) {
    let favs = getFavorites();
    id = String(id);

    if (favs.includes(id)) {
      favs = favs.filter(x => x !== id);
      showToast("❌ Dihapus dari Favorit");
    }

    saveFavorites(favs);
    renderFavorites(wisataData);
  }

  function renderFavorites(data) {
    const favList = document.getElementById("favList");
    const favs = getFavorites();

    const filtered = data.filter(item => favs.includes(String(item.id)));

    if (filtered.length === 0) {
      favList.innerHTML = "<p class='loading'>⭐ Belum ada destinasi favorit.</p>";
      return;
    }

    favList.innerHTML = "";

    filtered.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";

      card.onclick = () => {
        document.body.style.opacity = "0";
        setTimeout(() => {
          window.location.href = `detail.html?id=${item.id}`;
        }, 200);
      };

      card.innerHTML = `
        <div class="img-wrap">
          <img src="${item.foto}" alt="${item.nama}">
          <div class="overlay"></div>
          <div class="badge">${item.kategori || "Umum"}</div>
          <div class="fav-btn" onclick="event.stopPropagation(); toggleFavorite(${item.id});">❤️</div>
        </div>

        <div class="card-content">
          <h3>${item.nama}</h3>
          <p>${(item.deskripsi || "").substring(0, 110)}...</p>
        </div>
      `;

      favList.appendChild(card);
    });
  }

  loadDarkMode();
  loadWisata();
</script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
      .then(() => console.log("Service Worker Registered"))
      .catch(err => console.log("SW Failed", err));
  }
</script>

</body>
</html>
