<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informasi Rute Trekking</title>

<style>
:root{
  --primary:#2563eb;
  --secondary:#9333ea;
  --accent:#22c55e;

  --text:#0f172a;
  --muted:#64748b;

  --bg:#f1f5f9;
  --card:rgba(255,255,255,.92);
  --border:rgba(0,0,0,.06);

  --shadow:0 12px 30px rgba(15,23,42,.12);
  --radius:22px;
}

body.dark{
  --text:#f8fafc;
  --muted:#94a3b8;

  --bg:#0b1220;
  --card:rgba(20,27,45,.92);
  --border:rgba(255,255,255,.08);

  --shadow:0 12px 30px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.25s;
}

header{
  position:sticky;
  top:0;
  z-index:99;
  padding:18px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:white;
  border-bottom-left-radius:26px;
  border-bottom-right-radius:26px;
  box-shadow:0 10px 25px rgba(0,0,0,0.14);
}

header h1{
  margin:0;
  font-size:18px;
  font-weight:900;
}

.top-actions{
  margin-top:12px;
  display:flex;
  gap:10px;
  flex-wrap: wrap;
}

.chip {
   padding: 8px 14px;
   border-radius: 999px;
   background: rgba(255,255,255,0.18);
   border: 1px solid rgba(255,255,255,0.22);
   font-size: 12px;
   font-weight: 800;
   cursor: pointer;
   transition: 0.2s;
   user-select: none;
   text-decoration: none;
   color: white;
}

.chip:hover {
  background: rgba(255,255,255,0.26);
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
  padding-bottom:80px;
}

.hero{
  position:relative;
  height:280px;
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
  border: 1px solid var(--border);
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
  transform: scale(1.05);
}

.hero-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,0.75),transparent 60%);
}

.hero-title{
  position:absolute;
  bottom:14px;
  left:14px;
  right: 14px;
  color:white;
}

.hero-title h2{
  margin: 0;
  font-size: 18px;
  font-weight: 900;
}

.card{
  margin-top:16px;
  background:var(--card);
  padding:18px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  line-height:1.7;
  color:var(--muted);
}

.card h3{
  margin-top:0;
  margin-bottom:12px;
  color:var(--primary);
  font-size:16px;
  font-weight:900;
}

.loading{
  text-align:center;
  font-weight:900;
  color:var(--muted);
}

.trekking-map{
  margin:20px 0;
  text-align:center;
}

.trekking-map img{
  width:100%;
  max-width:420px;
  border-radius:18px;
  box-shadow:var(--shadow);
}

.trekking-text{
  line-height:1.8;
}

.trekking-text h4{
  margin-top:20px;
  margin-bottom:10px;
  color:var(--primary);
  font-size:18px;
  font-weight:700;
}

.trekking-text ol{
  margin-top:0;
  margin-bottom:18px;
  padding-left:28px;
}

.trekking-text li{
  margin-bottom:8px;
  line-height:1.8;
  text-align:justify;
}

.trekking-text ul{
  margin-top:0;
  margin-bottom:18px;
  padding-left:28px;
}

.trekking-text p{
  margin:0;
}

.trekking-text strong{
  color:var(--primary);
}

.qr-box{
  text-align:center;
}

#qrcode{
  display:flex;
  justify-content:center;
  margin-top:15px;
}
</style>
</head>

<body>

<header>
  <h1>🥾 Informasi Rute Trekking</h1>

  <div class="top-actions">
    <a class="chip" href="index.html">🏠 Home</a>
    <div class="chip" onclick="toggleDarkMode()">🌙 Dark Mode</div>
  </div>
</header>

<div class="container">

  <div class="hero" id="heroBox">
    <div class="loading" style="padding:40px;">
      ⏳ Memuat foto...
    </div>
  </div>

  <div class="card" id="contentBox">
    <div class="loading">
      ⏳ Memuat data...
    </div>
  </div>

  <div class="card qr-box">
    <h3>📌 QR Code Halaman Ini</h3>

    <div id="qrcode"></div>

    <p id="pageURL"
       style="font-size:12px;
       color:var(--muted);
       word-break:break-all;">
    </p>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
const apiURL =
"https://script.google.com/macros/s/AKfycbyCaDzpbAvtFbD-uNLix2hKZO_-qEn_mpdEAKJWO7zqvCEHslj8gxcUUX2MFTALB9sQ/exec";

function loadDarkMode(){
  const mode = localStorage.getItem("darkMode");
  if(mode === "on")document.body.classList.add("dark");
}

function toggleDarkMode(){
  document.body.classList.toggle("dark");

  if(document.body.classList.contains("dark")){
    localStorage.setItem("darkMode","on");
  }else{
    localStorage.setItem("darkMode","off");
  }
}

function generateQRCode(){

  const fullURL=window.location.href;

  document.getElementById("pageURL").innerText=fullURL;

  document.getElementById("qrcode").innerHTML="";

  new QRCode(
    document.getElementById("qrcode"),
    {
      text:fullURL,
      width:220,
      height:220,
      correctLevel:QRCode.CorrectLevel.H
    }
  );
}

async function loadData(){

  try{

    const res=await fetch(apiURL);
    const json=await res.json();

    const pura=json.data.find(
      item=>Number(item.id)===1
    );

    document.getElementById("heroBox").innerHTML=`
      <img src="${pura.foto}" alt="${pura.nama}">
      <div class="hero-overlay"></div>
      <div class="hero-title">
        <h2>${pura.nama}</h2>
      </div>
    `;

    document.getElementById("contentBox").innerHTML=`

      <h3>🥾 Peta Jalur Trekking</h3>

      <div class="trekking-map">
        <img
          src="${pura.foto_trekking}"
          alt="Peta Jalur Trekking">
      </div>

      <h3>📍 Informasi Jalur Trekking</h3>

      <div class="trekking-text">
        ${pura.jalur_trekking || "-"}
      </div>
    `;

    generateQRCode();

  }catch(err){

    document.getElementById("heroBox").innerHTML=
      "<div class='loading' style='padding:40px'>❌ Foto gagal dimuat</div>";

    document.getElementById("contentBox").innerHTML=
      "<div class='loading'>❌ Gagal memuat data.</div>";

    console.error(err);
  }
}

loadDarkMode();
loadData();
</script>

</body>
</html>
