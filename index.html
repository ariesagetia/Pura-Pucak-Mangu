<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Spiritual Tourism Guide</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <style>
    :root {
      --primary: #2563eb;
      --secondary: #9333ea;
      --accent: #22c55e;

      --text: #0f172a;
      --muted: #64748b;

      --bg: #f1f5f9;
      --card: rgba(255, 255, 255, 0.92);
      --border: rgba(0,0,0,0.06);

      --shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      --radius: 22px;
    }

    body.dark {
      --text: #f8fafc;
      --muted: #94a3b8;

      --bg: #0b1220;
      --card: rgba(20, 27, 45, 0.92);
      --border: rgba(255,255,255,0.08);

      --shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      transition: background 0.25s ease, color 0.25s ease;
    }

    /* SPLASH */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      flex-direction: column;
      text-align: center;
      transition: opacity 0.5s ease;
    }

    .splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,255,255,0.35);
      border-top: 4px solid white;
      border-radius: 50%;
      margin-top: 18px;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 18px 18px 22px;
      color: white;
      text-align: left;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 900;
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: 0.95;
    }

    .top-actions {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.22);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
      user-select: none;
      text-decoration: none;
      color: white;
    }

    .chip:hover {
      background: rgba(255,255,255,0.26);
    }

    /* CONTAINER */
    .container {
      max-width: 1000px;
      margin: auto;
      padding: 18px;
      padding-bottom: 90px;
    }

    /* CARD */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      animation: fadeUp 0.35s ease;
    }

    .hero {
      position: relative;
      height: 340px;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.05);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.78), transparent 60%);
    }

    .hero-title {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      color: white;
    }

    .hero-title h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.2;
    }

    .hero-title span {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 14px;
      background: rgba(34, 197, 94, 0.95);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .content {
      padding: 18px;
    }

    .section-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .section-box {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.95);
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
    }

    body.dark .section-box {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .section-box h3 {
      margin: 0 0 10px;
      color: var(--primary);
      font-size: 15px;
      font-weight: 900;
    }

    .btn {
      margin-top: 12px;
      display: inline-block;
      padding: 10px 14px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 900;
      font-size: 13px;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.28);
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .loading {
      padding: 22px;
      text-align: center;
      font-weight: 900;
      color: var(--muted);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media(min-width: 720px) {
      .section-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

<body>

<div class="splash" id="splash">
  <h1>🌍 Smart Spiritual Tourism Guide</h1>
  <p>Memuat informasi Smart Spiritual Tourism Guide - Pucak Mangu...</p>
  <div class="loader"></div>
</div>

<header>
  <h1>🌍 Smart Spiritual Tourism Guide</h1>
  <p>Selamat Datang di Pura Pucak Mangu</p>

  <div class="top-actions">
    <div class="chip" onclick="toggleDarkMode()">🌙 Dark Mode</div>
  </div>
</header>

<div class="container">
  <div class="card" id="destinasiCard">
    <div class="loading">⏳ Memuat data dari Spreadsheet...</div>
  </div>
</div>

<script>
  const apiURL = "https://script.google.com/macros/s/AKfycbyCaDzpbAvtFbD-uNLix2hKZO_-qEn_mpdEAKJWO7zqvCEHslj8gxcUUX2MFTALB9sQ/exec";

  function loadDarkMode() {
    const mode = localStorage.getItem("darkMode");
    if (mode === "on") document.body.classList.add("dark");
  }

  function toggleDarkMode() {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
      localStorage.setItem("darkMode", "on");
    } else {
      localStorage.setItem("darkMode", "off");
    }
  }

  function hideSplash() {
    const splash = document.getElementById("splash");
    splash.classList.add("hide");
    setTimeout(() => splash.style.display = "none", 550);
  }

  function ringkas(text, max = 200) {
    if (!text) return "-";
    if (text.length <= max) return text;
    return text.substring(0, max) + "...";
  }

  async function loadDestinasi() {
    try {
      const res = await fetch(apiURL);
      const json = await res.json();
      const data = json.data;

      const pura = data.find(item =>
        (item.nama || "").toLowerCase().includes("mangu")
      );

      if (!pura) {
        document.getElementById("destinasiCard").innerHTML =
          "<div class='loading'>❌ Data Puncak Mangu tidak ditemukan di Spreadsheet.</div>";
        hideSplash();
        return;
      }

      renderDestinasi(pura);
      hideSplash();

    } catch (err) {
      console.error(err);
      document.getElementById("destinasiCard").innerHTML =
        "<div class='loading'>❌ Gagal memuat data dari API.</div>";
      hideSplash();
    }
  }

  function renderDestinasi(pura) {
    document.getElementById("destinasiCard").innerHTML = `
      <div class="hero">
        <img src="${pura.foto}" alt="${pura.nama}">
        <div class="hero-overlay"></div>
        <div class="hero-title">
          <h2>${pura.nama}</h2>
          <span>Destinasi Spiritual</span>
        </div>
      </div>

      <div class="content">
        <div class="section-grid">
          <div class="section-box">
            <h3>📜 Gambaran Umum Pucak Mangu Temple</h3>
            ${ringkas(pura.deskripsi, 200)}
            <br>
            <a class="btn" href="deskripsi.html">Selengkapnya</a>
          </div>

          <div class="section-box">
            <h3>🕉 Nilai Spiritual dan Filosofi</h3>
            ${ringkas(pura.nilai_spiritual, 200)}
            <br>
            <a class="btn" href="spiritual.html">Selengkapnya</a>
          </div>

          <div class="section-box">
            <h3>🙏 Etika Pengunjung dan Guideline Area Sakral</h3>
            ${ringkas(pura.etika_berkunjung, 200)}
            <br>
            <a class="btn" href="etika.html">Selengkapnya</a>
          </div>

          <div class="section-box">
            <h3>🥾 Informasi Rute Trekking</h3>
            ${ringkas(pura.jalur_trekking, 200)}
            <br>
            <a class="btn" href="trekking.html">Selengkapnya</a>
          </div>
		  
		  <div class="section-box">
			<h3>🏡 Tourist Information</h3>
				Informasi penginapan di sekitar kawasan Pura Puncak Mangu.
			<br>
			<a class="btn" href="homestay.html">Selengkapnya</a>
		  </div>
        </div>
      </div>
    `;
  }

  loadDarkMode();
  loadDestinasi();
</script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
      .then(() => console.log("Service Worker Registered"))
      .catch(err => console.log("SW Failed", err));
  }
</script>

</body>
</html>
